[mod-description]
comfortable-night-vision-21=Kur përdoret pajisja e shikimit të natës, toni i ngjyrave do të mbetet i njëjtë si në perëndim të diellit në vend që të ndryshojë në tonin e zbehtë dhe të lodhshëm për sytë.\n\nPërshtatje në 2.1 e modit origjinal nga plexpt.
