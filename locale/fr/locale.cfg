[mod-description]
comfortable-night-vision-21=Lors de l'utilisation de l'équipement de vision nocturne, les couleurs restent celles du coucher de soleil au lieu de passer à une teinte désaturée et fatigante pour les yeux.\n\nPortage Factorio 2.1 du mod original de plexpt.

