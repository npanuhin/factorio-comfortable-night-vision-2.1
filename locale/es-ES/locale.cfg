[mod-description]
comfortable-night-vision-21=Al usar el equipo de visión nocturna, el tono de color permanecerá igual que al atardecer en lugar de cambiar a ese tono desaturado y molesto para la vista.\n\nPort para Factorio 2.1 del mod original de plexpt.

[mod-setting-name]
comfortable-night-vision-lut=Esquema de color de visión nocturna

[string-mod-setting]
comfortable-night-vision-lut-sunset=Atardecer (por defecto)
comfortable-night-vision-lut-dawn=Amanecer
comfortable-night-vision-lut-neutral=Neutro (sin filtro)
comfortable-night-vision-lut-vanilla=Vanilla (desaturada)
